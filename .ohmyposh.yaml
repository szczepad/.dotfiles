# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
# final_space: true
palette:
  os: "#ACB0BE"
  closer: p:os
  pink: "#F5C2E7"
  lavender: "#B4BEFE"
  blue: "#89B4FA"
blocks:
  - alignment: left
    segments:
      - foreground: "#FEFFEA"
        style: diamond
        background: "#009FB7"
        leading_diamond: 
        trailing_diamond: 
        template: "{{ if .SSHSession }}\ueba9 {{ .UserName }}@{{ .HostName }}{{ end }}"
        type: session
      - foreground: "#FEFFEA"
        properties:
          folder_icon: "...."
          home_icon: "~"
          style: powerlevel
        style: diamond
        leading_diamond: "\ue0b6"
        trailing_diamond: 
        background: "#009FB7"
        template: " {{ .Path }} "
        type: path
      - background: "#d2ff5e"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#ff9248{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f26d50{{ end }}"
          - "{{ if gt .Ahead 0 }}#89d1dc{{ end }}"
          - "{{ if gt .Behind 0 }}#f17c37{{ end }}"
        foreground: "#193549"
        powerline_symbol: ""
        properties:
          branch_icon: " "
          commit_icon: " "
          rebase_icon: " "
          revert_icon: " "
          tag_icon: " "
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
        style: powerline
        template:
          " {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{
          end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed)
          (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{
          end }} "
        type: git
    type: prompt
tooltips:
  - type: az
    tips:
      - az
      - terraform
    style: plain
    foreground: "#b4f9f8"
    template:  {{ .Name }}
final_space: true
version: 2
